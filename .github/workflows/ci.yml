name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: Auto-measure-backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Check backend dependency consistency
        working-directory: Auto-measure-backend
        run: python -m pip check

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Install browser for public-flow test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test public signup in Chromium
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
